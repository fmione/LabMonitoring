services:
  app:
    build: .
    container_name: expmonitor
    restart: unless-stopped
    environment:
      EXPMON_DATA_DIR: /data
      EXPMON_REFRESH_MS: ${EXPMON_REFRESH_MS:-5000}
      EXPMON_TZ: ${EXPMON_TZ:-Etc/GMT+3}
    volumes:
      - ${EXPMON_DATA_DIR_HOST}:/data
    ports:
      - "${EXPMON_PORT:-8100}:8000"